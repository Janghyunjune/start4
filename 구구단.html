<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>구구단 출력</title>
</head>
<body>
    <h2>구구단</h2>
    <script>
        // 2단부터 9단까지 반복하는 바깥쪽 for문
        for (let i = 2; i <= 9; i++) {
            document.write("<h3>" + i + "단</h3>");
            
            // 각 단에서 1부터 9까지 곱하는 안쪽 for문
            for (let j = 1; j <= 9; j++) {
                document.write(i + " x " + j + " = " + (i * j) + "<br>");
            }
        }
    </script>
</body>
</html>
