<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS 18 스타일 프리미엄 계산기</title>
    <style>
        * { box-sizing: border-box; }
        
        /* ---------------- 라이트/다크 모드 공통 ---------------- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; background: #e5e5ea;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .app-container { display: flex; gap: 20px; align-items: flex-start; }

        .calculator {
            background-color: #ffffff; padding: 30px 20px 40px 20px;
            border-radius: 45px; box-shadow: 0 20px 50px rgba(0,0,0,0.1), inset 0 0 0 4px #f2f2f7;
            width: 340px; position: relative; transition: all 0.4s ease;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; padding: 0 10px; position: relative;
        }
        .icon-btn {
            background: #f2f2f7; border: none; color: #ff9f0a; font-size: 18px;
            width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
            display: flex; justify-content: center; align-items: center; transition: all 0.3s;
        }
        .icon-btn:active { opacity: 0.6; }

        .menu-dropdown {
            position: absolute; top: 45px; left: 10px; background: #ffffff;
            border: 1px solid #d1d1d6; border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 170px; display: none; flex-direction: column; overflow: hidden; z-index: 10;
        }
        .menu-dropdown.show { display: flex; animation: dropDown 0.2s ease; }
        @keyframes dropDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .menu-item {
            background: none; border: none; color: #1c1c1e; padding: 12px 15px;
            text-align: left; font-size: 15px; cursor: pointer; border-bottom: 1px solid #f2f2f7;
            display: flex; align-items: center; gap: 8px;
        }
        .menu-item:hover { background: #f2f2f7; }

        /* 결과창 및 아이폰 스타일 Rad 라벨 고정 */
        .display-container { 
            display: flex; flex-direction: column; padding: 0 10px; margin-bottom: 20px; position: relative; 
        }
        
        #radLabel { 
            position: absolute; left: 12px; top: 25px; font-size: 11px; font-weight: 500; color: #8e8e93; display: block; pointer-events: none;
            transition: opacity 0.3s;
        }
        
        #display1 { text-align: right; border: none; font-size: 18px; color: #8e8e93; background: transparent; outline: none; margin-bottom: 2px; }
        #display2 { text-align: right; border: none; font-size: 56px; font-weight: 300; color: #000000; background: transparent; outline: none; width: 100%; letter-spacing: -1px; padding: 0; }

        .keypad-section { display: flex; flex-wrap: wrap; gap: 12px; width: 300px; margin: 0 auto; }
        
        #scientificPad { display: none; gap: 7px; margin-bottom: 12px; width: 300px; margin: 0 auto 12px auto; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        button.calc-btn {
            width: 66px !important; height: 66px !important; border-radius: 33px !important; border: none;
            background-color: #f2f2f7; color: #000000; cursor: pointer; font-size: 28px; font-weight: 400;
            display: flex; justify-content: center; align-items: center; padding: 0; margin: 0; transition: filter 0.1s;
        }
        button.calc-btn:active { filter: brightness(0.9); }

        button.btn-sci-small {
            width: 44px !important; height: 44px !important; border-radius: 22px !important; border: none;
            background-color: #e5e5ea; color: #000000; cursor: pointer; font-size: 14px; font-weight: 400;
            display: flex; justify-content: center; align-items: center; padding: 0; margin: 0; transition: filter 0.1s;
        }
        button.btn-sci-small:active { filter: brightness(0.9); }

        .btn-op { background-color: #ff9f0a !important; color: #fff !important; font-size: 34px !important; }
        .btn-top { background-color: #d1d1d6 !important; color: #000 !important; font-size: 24px !important;}

        .side-panel {
            width: 0; height: 640px; overflow: hidden; background-color: #ffffff; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1), padding 0.4s; display: flex; flex-direction: column; opacity: 0;
        }
        .side-panel.show { width: 340px; padding: 25px; opacity: 1; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f2f2f7; padding-bottom: 15px; margin-bottom: 20px; }
        .panel-header h3 { margin: 0; font-size: 20px; font-weight: 600; color: #1c1c1e; }
        .panel-content { display: none; flex-grow: 1; flex-direction: column; }
        .panel-content.active { display: flex; }
        .history-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; }
        .history-list li { text-align: right; margin-bottom: 15px; font-size: 16px; color: #8e8e93; border-bottom: 1px solid #f2f2f7; padding-bottom: 10px; }
        .history-list li .hist-result { display: block; font-size: 24px; font-weight: 500; color: #1c1c1e; margin-top: 5px; }

        #mathNotesArea {
            flex-grow: 1; width: 100%; border: none; resize: none; font-family: inherit; font-size: 18px; line-height: 1.5; color: #1c1c1e; outline: none;
            background: repeating-linear-gradient(transparent, transparent 31px, #e5e5ea 31px, #e5e5ea 32px); background-attachment: local;
        }

        .conv-group { margin-bottom: 15px; }
        .conv-group label { display: block; font-size: 14px; color: #8e8e93; margin-bottom: 5px; }
        .conv-group select, .conv-group input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #d1d1d6; font-size: 16px; outline: none; background: #f2f2f7; }
        .conv-result { margin-top: 20px; padding: 20px; background: #ff9f0a; color: white; border-radius: 15px; text-align: center; font-size: 24px; font-weight: bold; }
        .btn-action { background: #1c1c1e; color: white; border: none; padding: 12px; border-radius: 12px; font-size: 16px; cursor: pointer; width: 100%; }

        /* ---------------- 다크 모드 ---------------- */
        body.dark-mode { background: #121212; }
        body.dark-mode .calculator { background-color: #000000; box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 4px #2c2c2e; }
        body.dark-mode .icon-btn { background: #1c1c1e; }
        body.dark-mode .menu-dropdown { background: #2c2c2e; border: 1px solid #3a3a3c; }
        body.dark-mode .menu-item { color: #ffffff; border-bottom: 1px solid #3a3a3c; }
        body.dark-mode .menu-item:hover { background: #3a3a3c; }
        body.dark-mode #display2 { color: #ffffff; }
        body.dark-mode #radLabel { color: #8e8e93; }
        
        body.dark-mode button.calc-btn { background-color: #333333; color: #ffffff; }
        body.dark-mode button.calc-btn:active { filter: brightness(1.5); }
        
        body.dark-mode button.btn-sci-small { background-color: #2c2c2e; color: #ffffff; }
        body.dark-mode button.btn-sci-small:active { filter: brightness(1.5); }
        
        body.dark-mode .btn-top { background-color: #a5a5a5 !important; color: #000 !important; }

        body.dark-mode .side-panel { background-color: #2c2c2e; color: #ffffff; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        body.dark-mode .panel-header { border-bottom: 2px solid #3a3a3c; }
        body.dark-mode .panel-header h3 { color: #ffffff; }
        body.dark-mode .history-list li { border-bottom: 1px solid #3a3a3c; }
        body.dark-mode .history-list li .hist-result { color: #ffffff; }
        body.dark-mode #mathNotesArea { color: #ffffff; background: repeating-linear-gradient(transparent, transparent 31px, #3a3a3c 31px, #3a3a3c 32px); }
        body.dark-mode .conv-group select, body.dark-mode .conv-group input { background: #1c1c1e; border: 1px solid #3a3a3c; color: #ffffff; }
        body.dark-mode .btn-action { background: #48484a; }
    </style>
</head>
<body class="dark-mode">

<div class="app-container">
    <div class="calculator">
        <div class="top-bar">
            <div style="position: relative;">
                <button class="icon-btn" onclick="toggleMenu()" title="메뉴">☰</button>
                <div class="menu-dropdown" id="menuDropdown">
                    <button class="menu-item" onclick="setCalculatorMode('basic'); closeMenu();">📱 기본 계산기</button>
                    <button class="menu-item" onclick="setCalculatorMode('scientific'); closeMenu();">🧮 공학용 계산기</button>
                    <button class="menu-item" onclick="openPanel('notes'); closeMenu();">📝 수학 메모</button>
                    <button class="menu-item" onclick="openPanel('converter'); closeMenu();">🔄 단위/환율 변환</button>
                    <button class="menu-item" onclick="openPanel('history'); closeMenu();">🕒 계산 이력</button>
                </div>
            </div>
            <button class="icon-btn" onclick="toggleDarkMode()" title="다크모드 토글">🌗</button>
        </div>

        <div class="display-container">
            <span id="radLabel">Rad</span>
            <input type="text" id="display1" readonly placeholder=" ">
            <input type="text" id="display2" readonly placeholder="0">
        </div>
        
        <div id="scientificPad" class="keypad-section">
            <button class="btn-sci-small" onclick="inputBracket('(')">(</button>
            <button class="btn-sci-small" onclick="inputBracket(')')">)</button>
            <button class="btn-sci-small" onclick="memoryClear()">mc</button>
            <button class="btn-sci-small" onclick="memoryAdd()">m+</button>
            <button class="btn-sci-small" onclick="memorySub()">m-</button>
            <button class="btn-sci-small" onclick="memoryRecall()">mr</button>
            
            <button class="btn-sci-small" onclick="toggle2nd()">2nd</button>
            <button class="btn-sci-small" onclick="calcUnary('x²')">x²</button>
            <button class="btn-sci-small" onclick="calcUnary('x³')">x³</button>
            <button class="btn-sci-small" onclick="inputOperator('^')">xʸ</button>
            <button class="btn-sci-small" onclick="calcUnary('eˣ')">eˣ</button>
            <button class="btn-sci-small" onclick="calcUnary('10ˣ')">10ˣ</button>
            
            <button class="btn-sci-small" onclick="calcUnary('1/x')">1/x</button>
            <button class="btn-sci-small" onclick="calcUnary('²√x')">²√x</button>
            <button class="btn-sci-small" onclick="calcUnary('³√x')">³√x</button>
            <button class="btn-sci-small" onclick="inputOperator('yroot')">ʸ√x</button>
            <button class="btn-sci-small" onclick="calcUnary('ln')">ln</button>
            <button class="btn-sci-small" onclick="calcUnary('log')">log₁₀</button>
            
            <button class="btn-sci-small" onclick="calcUnary('x!')">x!</button>
            <button class="btn-sci-small" onclick="calcUnary('sin')">sin</button>
            <button class="btn-sci-small" onclick="calcUnary('cos')">cos</button>
            <button class="btn-sci-small" onclick="calcUnary('tan')">tan</button>
            <button class="btn-sci-small" onclick="inputConstant('e')">e</button>
            <button class="btn-sci-small" onclick="inputOperator('E')">EE</button>
            
            <button class="btn-sci-small" onclick="inputConstant('Rand')">Rand</button>
            <button class="btn-sci-small" onclick="calcUnary('sinh')">sinh</button>
            <button class="btn-sci-small" onclick="calcUnary('cosh')">cosh</button>
            <button class="btn-sci-small" onclick="calcUnary('tanh')">tanh</button>
            <button class="btn-sci-small" onclick="inputConstant('π')">π</button>
            <button class="btn-sci-small" id="btnDegRad" onclick="toggleDegRad()">Rad</button>
        </div>

        <div class="keypad-section">
            <button class="calc-btn btn-top" onclick="backspace()">
                <svg viewBox="0 0 24 24" width="30" height="30" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line>
                </svg>
            </button>
            <button class="calc-btn btn-top" id="btnClear" onclick="clearCalculator()" style="font-size:22px;">AC</button>
            <button class="calc-btn btn-top" onclick="inputPercentage()">%</button>
            <button class="calc-btn btn-op" onclick="inputOperator('/')">÷</button>
            
            <button class="calc-btn" onclick="inputNumber('7')">7</button>
            <button class="calc-btn" onclick="inputNumber('8')">8</button>
            <button class="calc-btn" onclick="inputNumber('9')">9</button>
            <button class="calc-btn btn-op" onclick="inputOperator('*')">×</button>
            
            <button class="calc-btn" onclick="inputNumber('4')">4</button>
            <button class="calc-btn" onclick="inputNumber('5')">5</button>
            <button class="calc-btn" onclick="inputNumber('6')">6</button>
            <button class="calc-btn btn-op" onclick="inputOperator('-')">-</button>
            
            <button class="calc-btn" onclick="inputNumber('1')">1</button>
            <button class="calc-btn" onclick="inputNumber('2')">2</button>
            <button class="calc-btn" onclick="inputNumber('3')">3</button>
            <button class="calc-btn btn-op" onclick="inputOperator('+')">+</button>
            
            <button class="calc-btn" onclick="toggleSign()">+/-</button>
            <button class="calc-btn" onclick="inputNumber('0')">0</button>
            <button class="calc-btn" onclick="inputNumber('.')">.</button>
            <button class="calc-btn btn-op" onclick="calculateResult()">=</button>
        </div>
    </div>

    <div class="side-panel" id="sidePanel">
        <div id="panel-history" class="panel-content">
            <div class="panel-header">
                <h3>계산 이력</h3>
                <button class="icon-btn" onclick="clearHistory()" style="color:#ff3b30; background:none;">🗑</button>
            </div>
            <ul class="history-list" id="historyList"></ul>
        </div>
        <div id="panel-notes" class="panel-content">
            <div class="panel-header">
                <h3>수학 메모</h3>
                <span style="font-size: 12px; color:#8e8e93;">자동 저장됨</span>
            </div>
            <textarea id="mathNotesArea" placeholder="수식이나 메모를 자유롭게 작성하세요..."></textarea>
        </div>
        <div id="panel-converter" class="panel-content">
            <div class="panel-header">
                <h3>변환기</h3>
            </div>
            <div class="conv-group">
                <label>변환 종류</label>
                <select id="convType" onchange="updateConvOptions()">
                    <option value="currency">환율</option>
                    <option value="length">길이</option>
                </select>
            </div>
            <div class="conv-group">
                <label>금액 / 수치</label>
                <div style="display:flex; gap:10px;">
                    <input type="number" id="convAmount" placeholder="값 입력">
                    <button class="btn-action" style="width:auto; padding:0 15px;" onclick="fetchCalcValue()">불러오기</button>
                </div>
            </div>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <div class="conv-group" style="flex:1;"><label>From</label><select id="convFrom"></select></div>
                <div class="conv-group" style="flex:1;"><label>To</label><select id="convTo"></select></div>
            </div>
            <button class="btn-action" onclick="performConversion()">변환하기</button>
            <div class="conv-result" id="convResult">0</div>
        </div>
    </div>
</div>

<script>
    const display1 = document.getElementById('display1');
    const display2 = document.getElementById('display2');
    const btnClear = document.getElementById('btnClear');
    const radLabel = document.getElementById('radLabel');
    
    let expressionTokens = []; 
    let displayTokens = [];    
    
    let currentInput = "0"; 
    let currentInputDisplay = "0"; 

    let isCalculated = false; 
    let memoryValue = 0;
    let isDegree = true; // 기본 Rad 모드 (아이폰과 동일하게 표시)

    function formatNumber(numStr) {
        if(!numStr || numStr === "Error" || numStr === "NaN") return numStr || "0";
        let str = numStr.toString();
        if (/[a-zA-Zπ√!()]/.test(str)) return str;

        let isNegative = str.startsWith("-");
        if (isNegative) str = str.slice(1);
        const parts = str.split(".");
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ","); 
        let formatted = parts.join(".");
        return isNegative ? "(-" + formatted + ")" : formatted;
    }

    function updateDisplay2() { 
        let valToDisplay = currentInput === "" ? "0" : currentInput;
        display2.value = formatNumber(valToDisplay); 
        btnClear.innerText = (currentInput === "0" && expressionTokens.length === 0) ? "AC" : "C";
    }

    function updateDisplay1() {
        if (isCalculated) return;
        let exprStr = displayTokens.join(' ');
        if (currentInputDisplay !== "" && currentInputDisplay !== "0") {
            exprStr += (exprStr ? " " : "") + formatNumber(currentInputDisplay); 
        }
        display1.value = exprStr;
    }

    function clearCalculator() {
        if (currentInput !== "0" && currentInput !== "") {
            currentInput = "0"; currentInputDisplay = "0";
        } else {
            currentInput = "0"; currentInputDisplay = "0";
            expressionTokens = []; displayTokens = [];
            display1.value = "";
        }
        isCalculated = false; updateDisplay2();
    }

    function backspace() {
        if (isCalculated) { display1.value = ""; isCalculated = false; return; }
        if (currentInput !== "0" && currentInput !== "") {
            currentInput = currentInput.slice(0, -1);
            currentInputDisplay = currentInput; 
            if (currentInput === "" || currentInput === "-") {
                currentInput = "0"; currentInputDisplay = "0";
            }
            updateDisplay2(); updateDisplay1();
        }
    }

    function toggleSign() {
        if (currentInput !== "0" && currentInput !== "") {
            currentInput = currentInput.startsWith("-") ? currentInput.slice(1) : "-" + currentInput;
            currentInputDisplay = currentInput;
            updateDisplay2(); updateDisplay1();
        }
    }

    function inputNumber(num) {
        if (isCalculated) { 
            expressionTokens = []; displayTokens = []; 
            currentInput = "0"; currentInputDisplay = "0";
            isCalculated = false; display1.value = ""; 
        }
        if (currentInput === "" && expressionTokens.length > 0) {
            let lastToken = expressionTokens[expressionTokens.length - 1];
            if (lastToken === ')') {
                expressionTokens.push('*');
                displayTokens.push('×');
            }
        }
        if (currentInput === "0" && num !== ".") {
            currentInput = num; currentInputDisplay = num;
        } else {
            if (num === '.' && currentInput.includes('.')) return;
            currentInput += num; currentInputDisplay += num;
        }
        updateDisplay2(); updateDisplay1();
    }

    function inputPercentage() {
        if (currentInput !== "") {
            currentInput = String(Number(currentInput) / 100);
            currentInputDisplay = currentInput;
            updateDisplay2(); updateDisplay1();
        }
    }

    function inputBracket(b) {
        if (isCalculated) { clearCalculator(); }
        if (b === '(') {
            if (currentInput !== "" && currentInput !== "0") {
                expressionTokens.push(currentInput, '*');
                displayTokens.push(formatNumber(currentInputDisplay), '×');
            } else if (expressionTokens.length > 0 && expressionTokens[expressionTokens.length - 1] === ')') {
                expressionTokens.push('*'); displayTokens.push('×');
            }
            expressionTokens.push('('); displayTokens.push('(');
            currentInput = ""; currentInputDisplay = "";
        } else if (b === ')') {
            if (currentInput !== "") {
                expressionTokens.push(currentInput); displayTokens.push(formatNumber(currentInputDisplay));
            }
            expressionTokens.push(')'); displayTokens.push(')');
            currentInput = ""; currentInputDisplay = "";
        }
        updateDisplay1();
    }

    function inputOperator(op) {
        if (isCalculated) { 
            expressionTokens = [currentInput]; displayTokens = [formatNumber(currentInputDisplay)]; 
            isCalculated = false; 
        } else if (currentInput !== "") { 
            expressionTokens.push(currentInput); displayTokens.push(formatNumber(currentInputDisplay));
        }
        
        if (expressionTokens.length > 0) {
            let last = expressionTokens[expressionTokens.length - 1];
            if (['+', '-', '*', '/', '^', 'yroot', 'E'].includes(last)) {
                expressionTokens.pop(); displayTokens.pop();
            }
        }
        
        expressionTokens.push(op);
        let dispOp = op;
        if(op === '*') dispOp = '×';
        if(op === '/') dispOp = '÷';
        if(op === 'yroot') dispOp = 'ʸ√';
        displayTokens.push(dispOp);
        
        currentInput = ""; currentInputDisplay = "";
        updateDisplay1();
    }

    function inputConstant(type) {
        if (isCalculated) { clearCalculator(); }
        let val = 0; let disp = "";
        if (type === 'π') { val = Math.PI; disp = "π"; }
        else if (type === 'e') { val = Math.E; disp = "e"; }
        else if (type === 'Rand') { val = Math.random(); disp = "Rand"; }

        if (currentInput !== "" && currentInput !== "0") {
            val = Number(currentInput) * val;
            disp = formatNumber(currentInputDisplay) + disp; 
        } else if (expressionTokens.length > 0 && expressionTokens[expressionTokens.length - 1] === ')') {
            expressionTokens.push('*');
            displayTokens.push('×');
        }
        
        currentInput = String(val);
        currentInputDisplay = disp;
        updateDisplay2(); updateDisplay1();
    }

    function getAngle(val) { return isDegree ? (val * Math.PI / 180) : val; }

    function factorial(n) {
        if (n < 0 || !Number.isInteger(n)) return "Error";
        if (n === 0 || n === 1) return 1;
        let res = 1; for(let i=2; i<=n; i++) res *= i; return res;
    }

    function calcUnary(func) {
        if (currentInput === "" && expressionTokens.length === 0) return;
        if (currentInput === "") { currentInput = "0"; currentInputDisplay = "0"; }
        
        let val = Number(currentInput);
        let result = 0; let disp = "";
        let dispFmt = formatNumber(currentInputDisplay);

        switch(func) {
            case 'x²': result = Math.pow(val, 2); disp = `${dispFmt}²`; break;
            case 'x³': result = Math.pow(val, 3); disp = `${dispFmt}³`; break;
            case 'eˣ': result = Math.exp(val); disp = `e^(${dispFmt})`; break;
            case '10ˣ': result = Math.pow(10, val); disp = `10^(${dispFmt})`; break;
            case '1/x': result = 1 / val; disp = `1/(${dispFmt})`; break;
            case '²√x': result = Math.sqrt(val); disp = `√(${dispFmt})`; break;
            case '³√x': result = Math.cbrt(val); disp = `³√(${dispFmt})`; break;
            case 'ln': result = Math.log(val); disp = `ln(${dispFmt})`; break;
            case 'log': result = Math.log10(val); disp = `log₁₀(${dispFmt})`; break;
            case 'x!': result = factorial(val); disp = `${dispFmt}!`; break;
            case 'sin': result = Math.sin(getAngle(val)); disp = `sin(${dispFmt})`; break;
            case 'cos': result = Math.cos(getAngle(val)); disp = `cos(${dispFmt})`; break;
            case 'tan': result = Math.tan(getAngle(val)); disp = `tan(${dispFmt})`; break;
            case 'sinh': result = Math.sinh(val); disp = `sinh(${dispFmt})`; break;
            case 'cosh': result = Math.cosh(val); disp = `cosh(${dispFmt})`; break;
            case 'tanh': result = Math.tanh(val); disp = `tanh(${dispFmt})`; break;
        }
        
        if (result !== "Error") {
            if (Math.abs(result) < 1e-14) result = 0; 
            result = parseFloat(result.toPrecision(14)); 
        }
        
        currentInput = String(result);
        currentInputDisplay = disp;
        updateDisplay2(); updateDisplay1();
    }

    function memoryClear() { memoryValue = 0; }
    function memoryAdd() { memoryValue += Number(currentInput || 0); }
    function memorySub() { memoryValue -= Number(currentInput || 0); }
    function memoryRecall() { currentInput = String(memoryValue); currentInputDisplay = currentInput; updateDisplay2(); updateDisplay1(); }

    function toggle2nd() { alert("2nd 기능은 모바일 기기 환경 전용입니다."); }
    function toggleDegRad() {
        isDegree = !isDegree;
        document.getElementById('btnDegRad').innerText = isDegree ? "Rad" : "Deg";
        radLabel.style.display = isDegree ? "block" : "none"; // 아이폰과 동일하게 Rad 모드일 때만 좌측 상단 표시
    }

    function safeEvaluate(tokens) {
        if (tokens.length === 0) return 0;
        let stack = [...tokens];

        while (stack.includes('(')) {
            let lastOpen = stack.lastIndexOf('(');
            let nextClose = stack.indexOf(')', lastOpen);
            if (nextClose === -1) nextClose = stack.length; 
            let innerTokens = stack.slice(lastOpen + 1, nextClose);
            let innerResult = safeEvaluate(innerTokens);
            stack.splice(lastOpen, nextClose - lastOpen + 1, String(innerResult));
        }

        let temp = [];
        for(let i=0; i<stack.length; i++) {
            if(stack[i] === '^' || stack[i] === 'yroot' || stack[i] === 'E') {
                let op = stack[i];
                let prev = Number(temp.pop());
                let next = Number(stack[++i]);
                if (op === '^') temp.push(Math.pow(prev, next));
                else if (op === 'yroot') temp.push(Math.pow(prev, 1/next)); 
                else if (op === 'E') temp.push(prev * Math.pow(10, next));
            } else temp.push(stack[i]);
        }
        stack = temp; temp = [];

        for(let i=0; i<stack.length; i++) {
            if(stack[i] === '*' || stack[i] === '/') {
                let op = stack[i];
                let prev = Number(temp.pop());
                let next = Number(stack[++i]);
                temp.push(op === '*' ? prev * next : (next !== 0 ? prev / next : "Error"));
            } else temp.push(stack[i]);
        }
        stack = temp;

        let res = Number(stack[0]);
        for(let i=1; i<stack.length; i+=2) {
            let op = stack[i];
            let next = Number(stack[i+1]);
            if (op === '+') res += next;
            else if (op === '-') res -= next;
        }
        
        if (res !== "Error") {
            if (Math.abs(res) < 1e-14) res = 0; 
            return parseFloat(res.toPrecision(14));
        }
        return "Error";
    }

    function calculateResult() {
        if (currentInput !== "") {
            expressionTokens.push(currentInput);
            displayTokens.push(formatNumber(currentInputDisplay));
        }
        if (expressionTokens.length === 0) return;

        let last = expressionTokens[expressionTokens.length - 1];
        if (['+', '-', '*', '/', '^', 'yroot', 'E'].includes(last)) {
            expressionTokens.pop(); displayTokens.pop();
        }

        let exprStr = displayTokens.join(' ');
        let result = safeEvaluate(expressionTokens);
        
        display1.value = exprStr + " ="; 
        currentInput = String(result);
        currentInputDisplay = String(result);
        expressionTokens = []; displayTokens = [];
        
        updateDisplay2();
        addHistory(exprStr, result);
        isCalculated = true; 
    }

    /* ================= 2. UI 제어 ================= */
    function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
    function toggleMenu() { document.getElementById('menuDropdown').classList.toggle('show'); }
    function closeMenu() { document.getElementById('menuDropdown').classList.remove('show'); }

    function setCalculatorMode(mode) {
        const sciPad = document.getElementById('scientificPad');
        if (mode === 'scientific') sciPad.style.display = 'flex';
        else sciPad.style.display = 'none';
    }

    let activePanel = "";
    function openPanel(panelName) {
        const sidePanel = document.getElementById('sidePanel');
        if(sidePanel.classList.contains('show') && activePanel === panelName) {
            sidePanel.classList.remove('show'); activePanel = ""; return;
        }
        document.querySelectorAll('.panel-content').forEach(el => el.classList.remove('active'));
        document.getElementById(`panel-${panelName}`).classList.add('active');
        sidePanel.classList.add('show'); activePanel = panelName;
        if(panelName === 'converter') updateConvOptions(); 
    }

    function addHistory(expr, res) {
        const list = document.getElementById('historyList');
        const li = document.createElement('li');
        li.innerHTML = `${expr} <span class="hist-result">=${formatNumber(res)}</span>`;
        list.prepend(li);
    }
    function clearHistory() { document.getElementById('historyList').innerHTML = ""; }

    /* ================= 3. 단위 변환기 ================= */
    const convData = {
        currency: { 
            options: ['KRW (한국)', 'USD (미국)', 'JPY (일본)', 'EUR (유럽)', 'GBP (영국)', 'CNY (중국)', 'CAD (캐나다)', 'AUD (호주)', 'HKD (홍콩)'], 
            rates: { 'KRW (한국)': 1, 'USD (미국)': 1380, 'JPY (일본)': 9.2, 'EUR (유럽)': 1470, 'GBP (영국)': 1720, 'CNY (중국)': 190, 'CAD (캐나다)': 1000, 'AUD (호주)': 900, 'HKD (홍콩)': 176 } 
        },
        length: { options: ['cm', 'm', 'km', 'inch', 'ft', 'yard'], rates: { cm: 1, m: 100, km: 100000, inch: 2.54, ft: 30.48, yard: 91.44 } }
    };

    function updateConvOptions() {
        const type = document.getElementById('convType').value;
        const fromSel = document.getElementById('convFrom');
        const toSel = document.getElementById('convTo');
        fromSel.innerHTML = ""; toSel.innerHTML = "";
        convData[type].options.forEach((opt) => {
            fromSel.add(new Option(opt, opt));
            toSel.add(new Option(opt, opt));
        });
        toSel.selectedIndex = 1; 
    }
    function fetchCalcValue() { document.getElementById('convAmount').value = currentInput !== "" ? currentInput : "0"; }
    function performConversion() {
        const type = document.getElementById('convType').value;
        const amt = Number(document.getElementById('convAmount').value);
        if(isNaN(amt)) return;
        const from = document.getElementById('convFrom').value, to = document.getElementById('convTo').value;
        const result = (amt * convData[type].rates[from]) / convData[type].rates[to];
        document.getElementById('convResult').innerText = formatNumber(parseFloat(result.toFixed(type === 'currency' ? 2 : 4))) + " " + to.split(' ')[0];
    }
