<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고급형 공학용 계산기</title>
    <style>
        /* 기본(라이트) 모드 & 레이아웃 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #e0e5ec, #ffffff);
            transition: background 0.3s ease;
        }

        .main-wrapper {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        /* 계산기 본체 디자인 (아이폰 스타일) */
        .calculator {
            background-color: #f3f3f3;
            padding: 30px 25px;
            border-radius: 40px;
            box-shadow: 10px 15px 30px rgba(0, 0, 0, 0.15), 
                        -10px -15px 30px rgba(255, 255, 255, 0.8);
            width: 320px;
            position: relative;
            transition: all 0.3s ease;
        }

        /* 다크모드 */
        body.dark-mode {
            background: linear-gradient(135deg, #121212, #2c2c2c);
        }
        body.dark-mode .calculator {
            background-color: #000000;
            box-shadow: 10px 15px 30px rgba(0, 0, 0, 0.5), 
                        -5px -5px 15px rgba(255, 255, 255, 0.05);
        }

        /* 상단 컨트롤 (다크모드 & 이력 토글) */
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .icon-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #555;
            transition: color 0.3s;
        }
        body.dark-mode .icon-btn { color: #ccc; }
        .icon-btn:hover { color: #ff9f0a; }

        /* 디스플레이 영역 */
        .display-container {
            display: flex;
            flex-direction: column;
            margin-bottom: 30px;
            padding: 0 10px;
        }
        #display1 {
            text-align: right;
            border: none;
            font-size: 16px;
            color: #8e8e93;
            background: transparent;
            outline: none;
            margin-bottom: 5px;
        }
        #display2 {
            text-align: right;
            border: none;
            font-size: 50px;
            font-weight: 300;
            color: #000;
            background: transparent;
            outline: none;
            width: 100%;
        }
        body.dark-mode #display2 { color: #fff; }

        /* 버튼 그리드 */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            aspect-ratio: 1 / 1;
            font-size: 22px;
            border: none;
            border-radius: 50%;
            background-color: #e0e0e0;
            color: #000;
            cursor: pointer;
            font-weight: 400;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: filter 0.2s, transform 0.1s;
        }
        button:active { transform: scale(0.9); }
        button:hover { filter: brightness(0.9); }

        body.dark-mode button { background-color: #333333; color: #fff; }
        body.dark-mode button:hover { filter: brightness(1.2); }

        /* 아이폰 색상 테마 적용 */
        .btn-op { background-color: #ff9f0a; color: #fff; font-size: 28px; }
        body.dark-mode .btn-op { background-color: #ff9f0a; }
        
        .btn-top { background-color: #d4d4d2; color: #000; }
        body.dark-mode .btn-top { background-color: #a5a5a5; color: #000; }

        .btn-sci { background-color: #e0e0e0; font-size: 16px; }
        body.dark-mode .btn-sci { background-color: #444; }

        .btn-zero {
            grid-column: span 2;
            aspect-ratio: auto;
            border-radius: 40px;
            justify-content: flex-start;
            padding-left: 28px;
        }

        /* 계산 이력 (History) 패널 */
        .history-panel {
            width: 0;
            overflow: hidden;
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 5px 10px 20px rgba(0,0,0,0.1);
            transition: width 0.4s ease, padding 0.4s ease;
            display: flex;
            flex-direction: column;
            opacity: 0;
            height: 550px;
        }
        .history-panel.show {
            width: 250px;
            padding: 20px;
            opacity: 1;
        }
        body.dark-mode .history-panel {
            background-color: #1e1e1e;
            color: #fff;
            box-shadow: 5px 10px 20px rgba(0,0,0,0.5);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        body.dark-mode .history-header { border-bottom: 1px solid #444; }
        
        .history-header h3 { margin: 0; font-size: 18px; }
        .clear-history-btn {
            background: none;
            border: none;
            color: #ff3b30;
            cursor: pointer;
            font-size: 14px;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }
        .history-list li {
            text-align: right;
            margin-bottom: 15px;
            font-size: 15px;
            color: #666;
            border-bottom: 1px dashed #eee;
            padding-bottom: 5px;
        }
        body.dark-mode .history-list li {
            color: #bbb;
            border-bottom: 1px dashed #444;
        }
        .history-list li .hist-result {
            display: block;
            font-size: 20px;
            font-weight: bold;
            color: #000;
            margin-top: 5px;
        }
        body.dark-mode .history-list li .hist-result { color: #fff; }
    </style>
</head>
<body class="dark-mode"> <!-- 기본값을 다크모드로 설정 -->

<div class="main-wrapper">
    <!-- 계산기 본체 -->
    <div class="calculator">
        <div class="controls">
            <button class="icon-btn" onclick="toggleDarkMode()" title="테마 변경">🌗</button>
            <button class="icon-btn" onclick="toggleHistory()" title="계산 이력">🕒</button>
        </div>

        <div class="display-container">
            <input type="text" id="display1" readonly placeholder="수식">
            <input type="text" id="display2" readonly placeholder="0">
        </div>
        
        <div class="buttons">
            <!-- 공학용 1열 -->
            <button class="btn-sci" onclick="calcScientific('sin')">sin</button>
            <button class="btn-sci" onclick="calcScientific('cos')">cos</button>
            <button class="btn-sci" onclick="calcScientific('tan')">tan</button>
            <button class="btn-sci" onclick="calcScientific('sqrt')">√</button>

            <!-- 기본 상단 컨트롤 -->
            <button class="btn-top" onclick="clearCalculator()">C</button>
            <button class="btn-top" onclick="inputOperator('^')">x²</button>
            <button class="btn-top" onclick="inputOperator('%')">%</button>
            <button class="btn-op" onclick="inputOperator('/')">÷</button>

            <button onclick="inputNumber('7')">7</button>
            <button onclick="inputNumber('8')">8</button>
            <button onclick="inputNumber('9')">9</button>
            <button class="btn-op" onclick="inputOperator('*')">×</button>

            <button onclick="inputNumber('4')">4</button>
            <button onclick="inputNumber('5')">5</button>
            <button onclick="inputNumber('6')">6</button>
            <button class="btn-op" onclick="inputOperator('-')">-</button>

            <button onclick="inputNumber('1')">1</button>
            <button onclick="inputNumber('2')">2</button>
            <button onclick="inputNumber('3')">3</button>
            <button class="btn-op" onclick="inputOperator('+')">+</button>

            <button class="btn-zero" onclick="inputNumber('0')">0</button>
            <button onclick="inputNumber('.')">.</button>
            <button class="btn-op" onclick="calculateResult()">=</button>
        </div>
    </div>

    <!-- 계산 이력 패널 -->
    <div class="history-panel" id="historyPanel">
        <div class="history-header">
            <h3>계산 이력</h3>
            <button class="clear-history-btn" onclick="clearHistory()">지우기</button>
        </div>
        <ul class="history-list" id="historyList">
            <!-- 이력이 여기에 추가됩니다 -->
        </ul>
    </div>
</div>

<script>
    const display1 = document.getElementById('display1');
    const display2 = document.getElementById('display2');
    const historyList = document.getElementById('historyList');
    
    let currentInput = ""; 
    let previousInput = ""; 
    let currentOperator = null; 
    let isCalculated = false; 

    // 다크모드 토글
    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
    }

    // 이력 패널 토글
    function toggleHistory() {
        const panel = document.getElementById('historyPanel');
        panel.classList.toggle('show');
    }

    // 계산 이력 추가 함수
    function addHistory(expression, result) {
        const li = document.createElement('li');
        li.innerHTML = `${expression} <span class="hist-result">=${result}</span>`;
        historyList.prepend(li); // 최신 내역을 위로 추가
    }

    // 계산 이력 삭제
    function clearHistory() {
        historyList.innerHTML = "";
    }

    // 초기화 기능 (C)
    function clearCalculator() {
        currentInput = "";
        previousInput = "";
        currentOperator = null;
        display1.value = "";
        display2.value = "0";
    }

    // 숫자 입력
    function inputNumber(num) {
        if (isCalculated) {
            currentInput = "";
            isCalculated = false;
        }
        if (num === '.' && currentInput.includes('.')) return;
        if (currentInput === "0" && num !== ".") currentInput = num;
        else currentInput += num;
        
        display2.value = currentInput;
    }

    // 사칙연산 입력
    function inputOperator(op) {
        if (currentInput === "" && previousInput === "") return;

        if (currentInput !== "" && previousInput !== "" && currentOperator) {
            calculateResult(false);
        }

        currentOperator = op;
        previousInput = currentInput !== "" ? currentInput : previousInput;
        currentInput = "";
        isCalculated = false;
        
        display1.value = `${previousInput} ${op}`;
    }

    // 공학용 특수 연산 (이력 추가 포함)
    function calcScientific(func) {
        if (currentInput === "" && previousInput === "") return;
        let val = Number(currentInput !== "" ? currentInput : previousInput);
        let result = 0;
        let expr = "";

        switch(func) {
            case 'sin': 
                result = Math.sin(val * Math.PI / 180); 
                expr = `sin(${val})`;
                break;
            case 'cos': 
                result = Math.cos(val * Math.PI / 180); 
                expr = `cos(${val})`;
                break;
            case 'tan': 
                result = Math.tan(val * Math.PI / 180); 
                expr = `tan(${val})`;
                break;
            case 'sqrt': 
                result = Math.sqrt(val); 
                expr = `√${val}`;
                break;
        }

        result = parseFloat(result.toFixed(8)); // 오차 보정
        
        display1.value = expr + " =";
        display2.value = result;
        
        addHistory(expr, result);

        currentInput = String(result);
        isCalculated = true;
    }

    // 등호(=) 계산 및 이력 추가 (eval 미사용)
    function calculateResult(showEqualSign = true) {
        if (previousInput === "" || currentInput === "" || !currentOperator) return;

        let num1 = Number(previousInput);
        let num2 = Number(currentInput);
        let result = 0;

        switch(currentOperator) {
            case '+': result = num1 + num2; break;
            case '-': result = num1 - num2; break;
            case '*': result = num1 * num2; break;
            case '/': result = num2 !== 0 ? num1 / num2 : "Error"; break;
            case '^': result = Math.pow(num1, num2); break;
            case '%': result = num1 % num2; break;
        }

        if(result !== "Error") {
            result = parseFloat(result.toFixed(8));
        }

        let expression = `${previousInput} ${currentOperator} ${currentInput}`;
        
        if (showEqualSign) {
            display1.value = expression + " =";
        }
        display2.value = result;
        
        addHistory(expression, result); // 이력 패널에 기록 추가
        
        currentInput = String(result);
        previousInput = "";
        currentOperator = null;
        isCalculated = true;
    }
</script>
</body>
</html>
